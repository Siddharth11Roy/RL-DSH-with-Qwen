# Default settings for rlh, sized for an RTX 3050 6 GB laptop GPU.
# Qwen3-1.7B in 4-bit, groups of 4 attempts and short episodes keep GRPO
# under about 5 GB. Copy this file and pass it with --config to override
# any value; unspecified keys fall back to these defaults.

model:
  base: Qwen/Qwen3-1.7B
  load_in_4bit: true
  max_new_tokens: 512

lora:
  rank: 16
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

harness:
  max_turns: 12
  tool_output_chars: 1500
  tool_timeout_s: 30
  settle_s: 3

grpo:
  group_size: 4
  max_episode_tokens: 3072
  learning_rate: 1.0e-5
  kl_beta: 0.04

world:
  runs_dir: runs
  parallel_episodes: 4

endpoint:
  base_url: http://127.0.0.1:8000/v1
  model_name: rlh-policy
